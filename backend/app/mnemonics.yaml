# Mapping eksplisit tag asli -> canonical field (docs/CHANNELS.md §0.1, §9).
# `mnem`: dicocokkan ke mnemonic LAS / kolom CSV (case-insensitive, persis).
# `desc`: dicocokkan ke deskripsi LAS / header CSV Navita bila mnemonic tidak dikenal (mis. SPARE1/SPARE2 rig).
# Tag yang tidak ada di sini TIDAK dipetakan (dicatat sebagai unmapped di QC).

time_index: [dtsrv, TIME, "Date time server"]
depth_index: [DEPTH, depth]

rig:
  bit_depth:    {mnem: [DBTM, DEPTBITM, "BIT DEPTH"], desc: ["Bit Depth (ftMD)", "Depth Bit (meas)"]}
  bit_tvd:      {mnem: [DBTV], desc: ["Bit Depth (TVD)", "Depth Bit (vt)"]}
  hole_depth:   {mnem: [DMEA, DEPTMEAS, "MEASURE DEPTH"], desc: ["Hole Depth (ftMD)", "Depth Hole (meas)"]}
  hole_tvd:     {mnem: [DVER, DEPTVERT, TVD], desc: ["Hole Depth (TVD)", "TVD Depth (ftMD)", "Depth Hole (vert)", "Depth Hole (vt)"]}
  block_pos:    {mnem: [BPOS, BLKPOS, "BLOCK HEIGHT"], desc: ["Block Position (ft)", "Block Position"]}
  rop:          {mnem: [ROP, ROPA, "ROP AVG"], desc: ["ROP (ft/h)", "Rate of Penetration (avg)"]}
  hookload:     {mnem: [HKLA, HOOKLOAD], desc: ["Hookload (klb)", "Hookload", "Hookload (avg)"]}
  hookload_max: {mnem: [HKLX], desc: ["Hookload (max)"]}
  wob:          {mnem: [WOB, WOBA], desc: ["WOB (klb)", "Weight-on-Bit (surf,avg)"]}
  torque:       {mnem: [TORQUE, TORQA], desc: ["Rotary Torque (kft-lb)", "Rotary Torque", "Rotary Torque (surf,avg)"]}
  torque_max:   {mnem: [TORQUEMAX], desc: ["Rotary Torque Max"]}
  rpm:          {mnem: [RPM, RPMA, SURFRPM, CRPM], desc: ["Surface RPM", "Rotary Speed (surf,avg)", "CRPM"]}
  spp:          {mnem: [SPP, SPPA], desc: ["Standpipe Pressure (psi)", "Standpipe Pressure", "Standpipe Pressure (avg)"]}
  flow_in:      {mnem: [MFIA, "MUD FLOW IN"], desc: ["Mud Flow In"]}
  flow_out_pct: {mnem: [MFOP, "MUD FLOW OUT"], desc: ["Mud Flow Out %"]}
  active_pit:   {mnem: [TVA, TVOLACT, "ACTIVE PIT"], desc: ["Tank Volume Active", "Tank Volume Ac", "Tank Volume (active)"]}
  trip_tank:    {mnem: [TRIPTANK, TTVOL1, "TRIP PIT"], desc: ["Trip Tank 1 Volume", "Trip Tank"]}
  gain_loss:    {mnem: [GL, TVOLCACT, "GAIN/LOSS"], desc: ["Gain Loss", "Gain / Loss", "Tank Volume Change (active)"]}
  ecd:          {mnem: [ECD], desc: ["ECD"]}
  anp:          {mnem: [ANP, "ANNULAR PRESSURE"], desc: ["Annular Pressure"]}
  mud_dens_in:  {mnem: [MDIA], desc: ["Mud Density In"]}
  inclination:  {mnem: [INCLCONT], desc: ["Inclination_Cont"]}
  azimuth:      {mnem: [], desc: ["Azimuth_cont"]}
  actc:         {mnem: [ACTC], desc: ["Drilling Condition", "Activity Code"]}
  spm1:         {mnem: [SPM1, "PUM 1"], desc: ["Pump Stroke Rate #1"]}
  spm2:         {mnem: [SPM2, "PUM 2"], desc: ["Pump Stroke Rate #2"]}
  spm3:         {mnem: [SPM3, "PUM 3"], desc: ["Pump Stroke Rate #3"]}

ppfg:
  md:        {mnem: [MDPPFG], desc: ["MD PPFG"]}
  tvd:       {mnem: [TVD], desc: ["TVD PPFG"]}
  pp:        {mnem: [PP], desc: ["Pore Pressure"]}
  sfg:       {mnem: [SFG], desc: ["SFG"]}
  fg_min:    {mnem: [FGMIN], desc: ["FGMIN"]}
  fg_max:    {mnem: [FGMAX], desc: ["Fracture Gradient"]}
  shmax:     {mnem: [SHMAX], desc: ["SHMax"]}
  obg:       {mnem: [OBG], desc: ["OBG"]}
  formation: {mnem: [FORMATION], desc: ["FORMATION"]}

mud:
  md:     {mnem: [MDPPFG], desc: []}
  tvd:    {mnem: [TVD], desc: []}
  mw:     {mnem: [MUDWEIGHT], desc: ["Mud Weight (ppg)"]}
  remark: {mnem: [REMARK], desc: ["REMARK"]}

survey:
  md:  {mnem: [DSVM], desc: ["Depth Svy reading (meas)"]}
  tvd: {mnem: [DSVV], desc: ["Depth Svy reading (vert)"]}
  inc: {mnem: [SINC], desc: ["Svy Inclination"]}
  azi: {mnem: [SAZC], desc: ["Svy Azimuth (corrected)"]}
  dls: {mnem: [SDLS], desc: ["Svy Dog Leg Severity"]}

# rentang fisik (QC); di luar rentang -> di-flag, tidak dibuang otomatis
ranges:
  ecd: [7, 20]
  spp: [0, 5000]
  wob: [0, 100]
  flow_in: [0, 1500]
  rpm: [0, 300]
  hookload: [0, 1000]
  torque: [0, 60]
  flow_out_pct: [0, 100]
